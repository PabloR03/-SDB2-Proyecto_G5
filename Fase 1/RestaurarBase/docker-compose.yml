version: "3.8"

services:
  postgres:
    image: manuelima/db_proyecto_db2_g5:latest
    container_name: imdb_postgres
    environment:
      POSTGRES_DB: imdb_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./restore.sh:/docker-entrypoint-initdb.d/restore.sh
    restart: unless-stopped
    networks:
      - postgres_network

volumes:
  postgres_data:

networks:
  postgres_network:
    driver: bridge
